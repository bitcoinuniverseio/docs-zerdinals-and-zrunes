name: self-hosted-release-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ contains(fromJSON('["push","schedule","workflow_dispatch"]'), github.event_name) && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') && fromJSON('["self-hosted","universe-runners-1"]') || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: public-docs-release
          path: dist
          if-no-files-found: error

# Publication is an explicit operator action on the self-hosted web server.
# Reuse the verified CI artifact when the source tree has not changed.
