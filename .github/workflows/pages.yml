name: self-hosted-release-artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, linux, x64, universe-super]
    steps:
      - uses: actions/checkout@v4
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: public-docs-release
          path: dist
          if-no-files-found: error

# Publication is an explicit operator action on the self-hosted web server.
# Reuse the verified CI artifact when the source tree has not changed.
