name: ci

on:
  pull_request:

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, linux, x64, universe-super]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find verified evidence for unchanged site inputs
        id: evidence
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const cp = require('node:child_process');
            const crypto = require('node:crypto');
            const path = require('node:path');
            const git = (...args) => cp.execFileSync('git', args, {maxBuffer: 16 * 1024 * 1024});
            const fingerprint = (ref) => crypto.createHash('sha256').update(
              git('ls-tree', '-r', '-z', '--full-tree', ref).toString().split('\0')
                .filter(line => line && !line.split('\t')[1].startsWith('.github/')).join('\0')
            ).digest('hex');
            const testedCommit = git('rev-parse', 'HEAD').toString().trim();
            const inputs = fingerprint(testedCommit);
            core.setOutput('reused', 'false');
            core.setOutput('inputs', inputs);
            core.setOutput('tested-commit', testedCommit);
            const {owner, repo} = context.repo;
            const runs = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id:'ci.yml', status:'success', per_page:30});
            for (const run of runs.data.workflow_runs) {
              if (run.repository.id !== context.payload.repository.id || run.head_repository.id !== context.payload.repository.id) continue;
              const artifacts = (await github.rest.actions.listWorkflowRunArtifacts({owner,repo,run_id:run.id})).data.artifacts;
              const release = artifacts.find(a => a.name === 'public-docs-release' && !a.expired);
              if (!release) continue;
              const record = artifacts.find(a => a.name === 'docs-ci-evidence' && !a.expired);
              let evidence;
              if (record) {
                const response = await github.rest.actions.downloadArtifact({owner,repo,artifact_id:record.id,archive_format:'zip'});
                const file = path.join(process.env.RUNNER_TEMP, 'docs-evidence-' + run.id + '.zip');
                fs.writeFileSync(file, Buffer.from(response.data));
                try { evidence = JSON.parse(cp.execFileSync('unzip',['-p',file,'ci-evidence.json'],{maxBuffer:1024*1024}).toString()); }
                finally { fs.unlinkSync(file); }
              } else if (run.id === 34344411887 && run.head_sha === '82b53a66a27171582352e683b2a12e2d3ccdd96c') {
                // Exact checkout recorded in this successful run's log.
                evidence = {runId:run.id,testedCommit:'b8cceeab6450d4a06daaba1273c0ae740f05e2f6'};
              } else continue;
              if (Number(evidence.runId) !== run.id || !/^[0-9a-f]{40}$/.test(evidence.testedCommit)) continue;
              try { git('cat-file','-e',evidence.testedCommit); }
              catch { git('fetch','origin',evidence.testedCommit); }
              const verifiedInputs = fingerprint(evidence.testedCommit);
              if (evidence.inputs && evidence.inputs !== verifiedInputs) throw new Error('Evidence fingerprint mismatch');
              if (verifiedInputs !== inputs) continue;
              const status = JSON.parse(fs.readFileSync('src/data/status.json','utf8'));
              const age = (Date.now() - Date.parse(status.verifiedAt)) / 86400000;
              if (!Number.isFinite(age) || age >= 45) throw new Error('Recorded status requires refresh');
              core.setOutput('reused','true');
              core.setOutput('run-id',String(run.id));
              await core.summary.addRaw('Reusing verified site checks and artifact from run ' + run.id + '. All tracked site inputs match; only CI configuration is excluded.').write();
              break;
            }
      - name: Restore the verified static release
        if: steps.evidence.outputs.reused == 'true'
        uses: actions/download-artifact@v4
        with:
          name: public-docs-release
          run-id: ${{ steps.evidence.outputs.run-id }}
          github-token: ${{ github.token }}
          path: dist
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main
        if: steps.evidence.outputs.reused != 'true'
      - name: Copy guard (long dash, banned word, marketing phrases)
        if: steps.evidence.outputs.reused != 'true'
        run: npm run check:copy
      - name: Public-safety scan (private hostnames, IPs, secret shapes)
        if: steps.evidence.outputs.reused != 'true'
        run: npm run check:public-safety
      - name: Status data is complete and fresh
        if: steps.evidence.outputs.reused != 'true'
        run: npm run check:status
      - name: llms.txt lists every published page
        if: steps.evidence.outputs.reused != 'true'
        run: npm run check:llms
      - name: Markdown lint
        if: steps.evidence.outputs.reused != 'true'
        run: npm run check:markdown
      - name: Build (validates every internal link and anchor)
        if: steps.evidence.outputs.reused != 'true'
        run: npm run build
      - name: External links
        if: steps.evidence.outputs.reused != 'true'
        run: npm run check:external-links
      - name: Install a browser for the accessibility audit
        if: steps.evidence.outputs.reused != 'true'
        # The self-hosted runner already owns its system browser dependencies.
        # Keep the install scoped to the pinned browser and service account.
        run: npx playwright install chromium
      - name: Verify preview ownership and cleanup
        if: steps.evidence.outputs.reused != 'true'
        run: node --test scripts/audit-built-site.test.mjs
      - name: Accessibility and horizontal overflow, every page, both themes
        if: steps.evidence.outputs.reused != 'true'
        run: node scripts/audit-built-site.mjs
      - name: Search index exists
        if: steps.evidence.outputs.reused != 'true'
        run: test -f dist/pagefind/pagefind.js
      - name: Sitemap exists
        if: steps.evidence.outputs.reused != 'true'
        run: test -f dist/sitemap-index.xml
      - name: Install the pinned secret scanner
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/trufflehog_3.90.5_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.5/trufflehog_3.90.5_linux_amd64.tar.gz \
            --output "${archive}"
          echo "dfbba5f4385f3dcafa095b08454e043a3abeb0913d4e0ef005ec61be61af99e0  ${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" trufflehog
      - name: Secret scan (full history)
        shell: bash
        run: >-
          "${RUNNER_TEMP}/trufflehog" git "file://${GITHUB_WORKSPACE}"
          --fail --github-actions --no-update --only-verified
      - name: Preserve the verified static release
        if: steps.evidence.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: public-docs-release
          path: dist
          if-no-files-found: error
      - name: Record the checked-out source identity
        if: steps.evidence.outputs.reused != 'true'
        uses: actions/github-script@v7
        env:
          DOCS_INPUTS: ${{ steps.evidence.outputs.inputs }}
          DOCS_TESTED_COMMIT: ${{ steps.evidence.outputs.tested-commit }}
        with:
          script: |
            require('node:fs').writeFileSync('ci-evidence.json', JSON.stringify({runId:context.runId,inputs:process.env.DOCS_INPUTS,testedCommit:process.env.DOCS_TESTED_COMMIT}));
      - name: Preserve verification provenance
        if: steps.evidence.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: docs-ci-evidence
          path: ci-evidence.json
          if-no-files-found: error
