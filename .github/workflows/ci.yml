name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: [self-hosted, linux, x64, universe-super]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main
      - name: Copy guard (long dash, banned word, marketing phrases)
        run: npm run check:copy
      - name: Public-safety scan (private hostnames, IPs, secret shapes)
        run: npm run check:public-safety
      - name: Status data is complete and fresh
        run: npm run check:status
      - name: llms.txt lists every published page
        run: npm run check:llms
      - name: Markdown lint
        run: npm run check:markdown
      - name: Build (validates every internal link and anchor)
        run: npm run build
      - name: External links
        run: npm run check:external-links
      - name: Install a browser for the accessibility audit
        # The self-hosted runner already owns its system browser dependencies.
        # Keep the install scoped to the pinned browser and service account.
        run: npx playwright install chromium
      - name: Verify preview ownership and cleanup
        run: node --test scripts/audit-built-site.test.mjs
      - name: Accessibility and horizontal overflow, every page, both themes
        run: node scripts/audit-built-site.mjs
      - name: Search index exists
        run: test -f dist/pagefind/pagefind.js
      - name: Sitemap exists
        run: test -f dist/sitemap-index.xml
      - name: Install the pinned secret scanner
        shell: bash
        run: |
          archive="${RUNNER_TEMP}/trufflehog_3.90.5_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.90.5/trufflehog_3.90.5_linux_amd64.tar.gz \
            --output "${archive}"
          echo "dfbba5f4385f3dcafa095b08454e043a3abeb0913d4e0ef005ec61be61af99e0  ${archive}" \
            | sha256sum --check --strict
          tar --extract --gzip --file "${archive}" --directory "${RUNNER_TEMP}" trufflehog
      - name: Secret scan (full history)
        shell: bash
        run: >-
          "${RUNNER_TEMP}/trufflehog" git "file://${GITHUB_WORKSPACE}"
          --fail --github-actions --no-update --only-verified
      - name: Preserve the verified static release
        uses: actions/upload-artifact@v4
        with:
          name: public-docs-release
          path: dist
          if-no-files-found: error
