name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

# This repository is public, so jobs run on GitHub-hosted runners: fork pull
# requests must never reach self-hosted infrastructure.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: runs-on=${{ github.run_id }}-checks/runner=universe-hosted/cpu=2+8/env=production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: bitcoinuniverseio/universe-ci-actions/universe-node-env@main
      - name: Copy guard (long dash, banned word, marketing phrases)
        run: npm run check:copy
      - name: Public-safety scan (private hostnames, IPs, secret shapes)
        run: npm run check:public-safety
      - name: Status data is complete and fresh
        run: npm run check:status
      - name: llms.txt lists every published page
        run: npm run check:llms
      - name: Markdown lint
        run: npm run check:markdown
      - name: Build (validates every internal link and anchor)
        run: npm run build
      - name: External links
        run: npm run check:external-links
      - name: Install a browser for the accessibility audit
        run: npx playwright install --with-deps chromium
      - name: Serve the built site
        run: npx astro preview --port 4323 &
      - name: Accessibility and horizontal overflow, every page, both themes
        run: npx wait-on http://localhost:4323/docs-zerdinals-and-zrunes/ && npm run check:a11y
      - name: Search index exists
        run: test -f dist/pagefind/pagefind.js
      - name: Sitemap exists
        run: test -f dist/sitemap-index.xml
      - name: Secret scan (full history)
        uses: trufflesecurity/trufflehog@v3.90.5
        with:
          base: ''
          head: ''
          extra_args: --only-verified
